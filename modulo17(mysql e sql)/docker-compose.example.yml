version: "3"
services: 
  mysql_knex:
    container_name: mysql_knex
    hostname: mysql_knex
    image: mysql:8.0
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_force_recovery=0
    volumes: 
      # substitua o caminho antes de ":" pelo diretório local onde deseja persistir os dados do banco
      - ./caminho/local/para/dados:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      # preencha com as suas credenciais seguras no seu arquivo docker-compose.yml local
      MYSQL_ROOT_PASSWORD: sua_senha_root_aqui
      MYSQL_DATABASE: nome_do_banco_de_dados
      MYSQL_USER: nome_do_usuario
      MYSQL_PASSWORD: senha_do_usuario
      TZ: America/Sao_Paulo
